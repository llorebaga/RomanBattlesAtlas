# Dependencies approved to run their install/build scripts. pnpm blocks these
# by default as a supply-chain safeguard; setting each to `true` here (pnpm's
# `allowBuilds` setting) lets install run them instead of failing with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
