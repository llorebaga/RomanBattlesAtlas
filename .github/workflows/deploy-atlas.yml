name: Build and deploy the Atlas

# Builds the static site from the source in this repository and publishes it to
# GitHub Pages, which serves it at https://llorebaga.github.io/RomanBattlesAtlas/.
#
# Source and published site live in this one public repository. Nothing has to be
# copied to a second repository, so no deploy token or repository secret is
# needed: the built-in GITHUB_TOKEN below is enough.
#
# Pages must be set to "GitHub Actions" as its source (Settings → Pages). The
# configure-pages step below asserts that and will switch it if it drifts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy, but never cancel one halfway:
# a cancelled deployment can leave Pages serving a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run logic tests
        run: pnpm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: pnpm run build:pages
        env:
          GITHUB_PAGES: "true"
          # The site is served from /<repository>, so the base path follows the
          # repository name rather than being written out here twice.
          GITHUB_PAGES_REPOSITORY: ${{ github.event.repository.name }}

      - name: Keep Pages from treating _next as Jekyll input
        run: touch out/.nojekyll

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
